name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            apt_pkg: build-essential
          - goos: linux
            goarch: 386
            cc: i686-linux-gnu-gcc
            apt_pkg: gcc-i686-linux-gnu
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu
          - goos: linux
            goarch: arm
            goarm: 7
            cc: arm-linux-gnueabihf-gcc
            apt_pkg: gcc-arm-linux-gnueabihf

          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            apt_pkg: mingw-w64
          - goos: windows
            goarch: 386
            cc: i686-w64-mingw32-gcc
            apt_pkg: mingw-w64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.15'

      - name: Install CGO Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_pkg }}

      - name: Build C-Archive
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: go build -buildmode=c-archive -ldflags "-s -w" -o libconlib.a.${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: libconlib.a.${{ matrix.goos }}-${{ matrix.goarch }}*
